[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "simplified-auction"
version = "0.1.0"
description = "CRM de leilao de imoveis da Caixa: coleta, enriquecimento, due diligence e analise de documentos."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "pypdf>=4.2",
]

[project.optional-dependencies]
gui = ["Pillow>=10"]
browser = ["playwright>=1.44"]
dev = [
    "pytest>=8",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-beautifulsoup4",
]

[project.scripts]
auction = "simplified_auction.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/simplified_auction"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PTH", "D", "ANN"]
ignore = ["D203", "D213", "D105", "D107", "ANN401"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ANN", "S101"]
"src/simplified_auction/gui/*" = ["ANN", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = ["PIL", "PIL.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["playwright", "playwright.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["simplified_auction.gui.*"]
disallow_untyped_defs = false
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
